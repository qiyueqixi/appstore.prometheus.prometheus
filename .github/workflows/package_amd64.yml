name: package_amd64
run-name: ${{ github.actor }} build ${{ github.ref_name }} sha ${{ github.sha }}

permissions:
  contents: write
  actions: write
on:
  workflow_call:
    inputs:
      target_version:
        required: true
        type: string
        default: ""
      this_pack_version:
        required: true
        type: string
        default: ""
jobs:
  build_appstore_package_amd64:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      target_version: ${{ inputs.target_version }}
      target_pack_arch: "amd64"
      this_pack_version: ${{ inputs.this_pack_version }}
      this_pack_arch: "x86_64"
    steps:
     - name: Check out repository code
       uses: actions/checkout@v4
     - name: Set up Go
       uses: actions/setup-go@v6
       with:
         go-version-file: manager/go.mod
         cache-dependency-path: manager/go.sum
     - name: List files in the repository
       run: |
         pwd
         ls -l
     - name: 下载压缩文件
       run: |
         wget https://github.com/prometheus/prometheus/releases/download/v${{ env.target_version }}/prometheus-${{ env.target_version }}.linux-${{ env.target_pack_arch }}.tar.gz
     - name: 解压压缩文件
       run: |
         tar -zxvf prometheus-${{ env.target_version }}.linux-${{ env.target_pack_arch }}.tar.gz
     - name: 构建独立版与原版升级版
       shell: pwsh
       run: |
         ./scripts/package-release.ps1 -Version '${{ env.target_version }}' -PackVersion '${{ env.this_pack_version }}' -Architectures amd64 -UpstreamRoot '${{ github.workspace }}'
     - name: 上传两种应用包
       uses: actions/upload-artifact@master
       with:
         name: prometheus-packages-${{ env.target_pack_arch }}
         path: dist/*.fpk
